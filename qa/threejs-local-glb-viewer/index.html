<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>인테리어 3D 원본 검수 뷰어 · 로컬 전용</title><link rel="icon" href="data:,">
<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:#0e1420;color:#edf2f8}
header{padding:17px 22px;background:#182234;border-bottom:1px solid #334154}header h1{margin:0 0 6px;font-size:22px}header p{margin:0;color:#b7c5d6;font-size:13px}
main{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);min-height:calc(100vh - 90px)}
aside{padding:20px;border-right:1px solid #334154;background:#111b29}section{margin-bottom:20px}
label{display:block;margin:12px 0 5px;font-size:13px;color:#b7c5d6}input{width:100%;max-width:100%;font-size:13px}
button{border:1px solid #627d98;background:#23364c;color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #80bfff;outline-offset:2px}
#canvas{position:relative;min-height:480px}canvas{display:block}
#status{line-height:1.7;overflow-wrap:anywhere;white-space:pre-wrap}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#b9d2e3}
.note{background:#30261b;padding:12px;border-left:3px solid #d8a74b;font-size:12px;line-height:1.55}
#info{position:absolute;top:12px;left:12px;padding:8px 12px;border-radius:6px;background:#111b29b8;font-size:12px}
@media(max-width:760px){main{display:flex;flex-direction:column}aside{border-right:0;border-bottom:1px solid #334154}#canvas{height:52vh;min-height:340px}}
</style></head><body>
<header><h1>인테리어 3D 웹뷰어 — QA LOCAL ONLY</h1><p>모델을 서버에 전송하지 않습니다 · 승인·실측·견적·발행과 분리된 격리 시험입니다</p></header>
<main><aside>
<section><label for="glb">① 로컬 GLB 파일 (최대 120MB)</label><input id="glb" type="file" accept=".glb,model/gltf-binary">
<label for="manifest">② 검수 JSON 영수증 (선택)</label><input id="manifest" type="file" accept=".json,application/json">
<p class="note">SKP 원본이나 고객 도면은 업로드하지 마세요. GLB는 승인된 별도 QA 복사본에서 준비해야 합니다. JSON이 없으면 모델을 표시해도 출처 검증은 HOLD입니다.</p>
<button id="load">로컬 파일 검수 후 열기</button></section>
<section><strong>검수 상태</strong><p id="status" role="status" aria-live="polite">GLB를 선택해 주세요.</p></section>
<section><strong>선택된 메시</strong><pre id="selection">미선택</pre></section>
<section><strong>SHA256 및 출처</strong><pre id="receipt">검수 대기</pre></section>
</aside><section id="canvas"><div id="info">마우스/터치: 회전 · 확대 · 모델 클릭해 메시명 확인</div></section></main>
<script type="module" src="/src/main.mjs"></script>
</body></html>
