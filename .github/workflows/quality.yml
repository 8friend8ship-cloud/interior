name: Interior Quality Gate

on:
  pull_request:
  push:
    branches:
      - codex/**

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --ignore-scripts
      - name: Regression 1
        run: |
          npm test
          npm run typecheck
          npm run build
          npm run check:bundle
      - name: Regression 2
        run: |
          npm test
          npm run typecheck
          npm run build
          npm run check:bundle
      - name: Dependency audit
        run: npm audit --audit-level=high
